<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otter Monitor — logowanie</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦦</text></svg>">
<style>
  :root {
    --surface: #fcfcfb; --page: #f0f2f5; --ink: #0b0b0b; --ink-2: #52514e;
    --muted: #898781; --line: #e1e0d9; --accent: #2a78d6; --accent-hover: #256abf;
    --danger: #d03b3b; --danger-bg: #fdf1f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19; --page: #0d0d0d; --ink: #ffffff; --ink-2: #c3c2b7;
      --muted: #898781; --line: #2c2c2a; --accent: #3987e5; --accent-hover: #5598e7;
      --danger: #e66767; --danger-bg: #2a1717;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
      radial-gradient(900px 500px at 110% 110%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
      var(--page);
    color: var(--ink);
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 400px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 18px;
    padding: 40px 36px; box-shadow: 0 20px 50px rgba(0,0,0,.10);
  }
  .logo { font-size: 44px; line-height: 1; }
  h1 { font-size: 22px; margin: 14px 0 4px; letter-spacing: -.02em; }
  .sub { color: var(--ink-2); font-size: 14px; margin-bottom: 28px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 16px 0 6px; }
  input {
    width: 100%; padding: 11px 14px; font-size: 15px; color: var(--ink);
    background: transparent; border: 1.5px solid var(--line); border-radius: 10px;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  button {
    width: 100%; margin-top: 26px; padding: 12px; font-size: 15px; font-weight: 600;
    color: #fff; background: var(--accent); border: 0; border-radius: 10px;
    cursor: pointer; transition: background .15s;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .6; cursor: wait; }
  .error {
    display: none; margin-top: 18px; padding: 10px 14px; font-size: 13.5px;
    color: var(--danger); background: var(--danger-bg);
    border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); border-radius: 10px;
  }
  .foot { margin-top: 26px; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">🦦</div>
    <h1>Otter Monitor</h1>
    <p class="sub">Zaloguj się, aby zobaczyć stan sond</p>
    <form id="form" autocomplete="on">
      <label for="email">Adres e-mail</label>
      <input id="email" type="email" name="email" required autocomplete="username" autofocus>
      <label for="password">Hasło</label>
      <input id="password" type="password" name="password" required autocomplete="current-password">
      <div class="error" id="error"></div>
      <button id="btn" type="submit">Zaloguj się</button>
    </form>
    <p class="foot">Monitoring sond · alerty e-mail · Railway</p>
  </main>
<script src="/login.js"></script>
</body>
</html>
